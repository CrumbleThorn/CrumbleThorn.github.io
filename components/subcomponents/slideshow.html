<!--
Available Slideshow data- attributes:
data-dimensions="square_dimensions": Sets the square dimensions of the slideshow frame
data-dimensions="width height": Sets the width and height of the slideshow frame
data-image-href="image1 image2...": Sets the images to be displayed in the slideshow IN ORDER
data-duration: Sets how long each image is automatically displayed for
data-transition="fade | directional_fade | push | zoom": Sets the type of transition between images
data-add-progressbar="true": Adds a progress bar at the bottom of the panel
data-add-controls="true": Adds slideshow controls (and displays how many images are in the slideshow) when hovered
-->
<div id="slideshow">
    <div id="slideshow-window"></div>
</div>
