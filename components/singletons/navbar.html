<!--
Available Navbar data- attributes:
data-sidebar-id: Links the sidebar and adds a burger menu button to the navbar
data-logo-src: Adds logo to the navbar
data-logo-id: Uses the element with the ID provided as the logo
data-title: Adds title text to the navbar
data-title-id: Uses the element with the ID provided as the title
data-progressbar-start-id: adds a progress bar to the navbar using the provided startId as the stating progress point
data-menuitem*="link_text": Creates a Navbar Entry with the provided text
data-menuitem*="link_text href/": Creates a Navbar Link with the provided text and href
data-menuitem*="link_text dropdown dropdown-id": Creates a Navbar Entry that shows a dropdown when hovered or clicked
NOTE: data-menuitem* MUST start with 1 and CANNOT skip numbers
-->
<nav id="navbar">
    <div id="navbar-content">

        <div id="navbar-label">
        <!--TO DO: Add hover animation to title-->
        </div>
        <div id="navbar-menu">
        </div>
    </div>
</nav>
